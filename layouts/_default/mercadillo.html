<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Productos disponibles</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  background:#e9e9e9;
  color:#111;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* ===== Navbar ===== */
.navbar{
  background:#000;
  padding:20px 60px;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.navbar h2{
  margin:0;
  font-size:20px;
  font-weight:600;
}

.navbar a{
  color:white;
  text-decoration:none;
  margin-left:30px;
  font-size:18px;
  font-weight:600;
  transition:0.2s;
}

.navbar a:hover{
  opacity:0.7;
}

/* ===== Título ===== */
h1{
  text-align:center;
  font-size:40px;
  margin-top:90px;
  margin-bottom:40px;
}

/* ===== Grid ===== */
#productos{
  max-width:1100px;
  margin:0 auto 80px auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:40px;
  padding:0 20px;
  flex:1;
}

/* ===== Cards ===== */
.card{
  background:white;
  border-radius:14px;
  padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
  transition:0.3s ease;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:15px;
}

.card h3{
  font-size:22px;
  margin:10px 0 15px 0;
}

.card p{
  margin:6px 0;
  font-size:15px;
}

.precio{
  font-size:20px;
  font-weight:600;
  margin:10px 0;
}

/* ===== Footer oscuro ===== */
.footer{
  background:#000;
  color:#ccc;
  padding:40px 20px;
  text-align:center;
  margin-top:auto;
}

.footer h3{
  margin:0 0 15px 0;
  color:white;
  font-weight:600;
}

.footer p{
  margin:5px 0;
  font-size:14px;
  opacity:0.8;
}

.footer a{
  color:white;
  text-decoration:none;
  margin:0 10px;
  font-size:14px;
}

.footer a:hover{
  opacity:0.7;
}

</style>
</head>

<body>

<div class="navbar">
  <h2>Mercadillo</h2>
  <div>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdcFWfklSOJQ7I1sbAYSygQGUfUWmKPIU4QuWiq-B6PCsUrfQ/viewform?usp=dialog" target="_blank">
      Publicar artículos
    </a>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSeKHNc3UJ6rLBAEsX9K8iC1F4H5uv4486xpoOrUfTJKT8cA2w/viewform?usp=header" target="_blank">
      Notificar compra
    </a>
  </div>
</div>

<h1>Productos disponibles</h1>

<div id="productos"></div>

<!-- ===== Footer ===== -->
<div class="footer">
  <h3>Mercadillo de la Escola</h3>
  <p>Recuerda notificar en el botón del menú las compras que realices, para que podamos eliminar los artículos del tablón.</p>
  <p>© 2026 Escola Galega de Esgrima</p>
</div>

<script>

const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQosl1IBBHhaLwjsC0-LkTVhSQbX_hVoT1-251aS5X9ERzXUDH39U-wfCg0kutxH4aQM03w1Z72PIY5/pub?gid=0&single=true&output=csv";

fetch(urlCSV)
  .then(res => res.text())
  .then(data => {

    const filas = data.split("\n").slice(1);
    const contenedor = document.getElementById("productos");
    contenedor.innerHTML = "";

    filas.forEach(fila => {

      const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      if(columnas.length < 10) return;

      const producto  = columnas[0]?.replace(/"/g,"").trim();
      const marca     = columnas[1]?.replace(/"/g,"").trim();
      const talla     = columnas[2]?.replace(/"/g,"").trim();
      const precio    = columnas[3]?.replace(/"/g,"").trim();
      const precioTienda = columnas[4]?.replace(/"/g,"").trim();

      let imagen = columnas[5]?.replace(/"/g,"").trim();
      if(imagen.includes("drive.google.com/file/d/")){
        const id = imagen.split("/d/")[1].split("/")[0];
        imagen = "https://drive.google.com/thumbnail?id=" + id + "&sz=w1000";
      }

      const estado    = columnas[6]?.replace(/"/g,"").trim();
      const info      = columnas[7]?.replace(/"/g,"").trim();
      const contacto  = columnas[8]?.replace(/"/g,"").trim();
      const aprobado  = columnas[9]?.replace(/"/g,"").trim().toUpperCase();

      if(aprobado !== "SI") return;
      if(!producto) return;

      contenedor.innerHTML += `
        <div class="card">
          <img src="${imagen}" alt="${producto}">
          <h3>${producto}</h3>
          <p><strong>Marca:</strong> ${marca}</p>
          <p><strong>Talla:</strong> ${talla}</p>
          <p class="precio">${precio} €</p>
          <p style="opacity:0.6;">Precio en tienda: ${precioTienda}</p>
          <p><strong>Estado:</strong> ${estado}</p>
          <p>${info}</p>
          <p><strong>Contacto:</strong> ${contacto}</p>
        </div>
      `;

    });

  })
  .catch(err => console.error("Error:", err));

</script>

</body>
</html>
